services:
  db:
    image: postgres:16-alpine
    container_name: superapp-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-selfone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      POSTGRES_DB: ${POSTGRES_DB:-selfone}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ./backend/data/postgres:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql

  # UI untuk melihat database
  pgadmin:
    image: dpage/pgadmin4
    container_name: superapp-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@localhost.test}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in the root .env file}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - db
