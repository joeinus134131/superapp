name: VPS images and installer

on:
  workflow_dispatch:
    inputs:
      release:
        description: Immutable image tag (for example v1.0.0)
        required: true
      app_domain:
        description: Target web domain (without https://)
        required: true

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      APP_DOMAIN: ${{ inputs.app_domain }}
      RELEASE: ${{ inputs.release }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate public build configuration
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          [[ "$APP_DOMAIN" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]+$ ]]
          [[ "$RELEASE" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]
          printf 'IMAGE_BASE=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish API and migrator image
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_BASE }}-api:${{ inputs.release }}
      - name: Publish deployment-specific web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_BASE }}-web:${{ inputs.release }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://${{ inputs.app_domain }}/api/v1
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_MIDTRANS_CLIENT_KEY=${{ vars.NEXT_PUBLIC_MIDTRANS_CLIENT_KEY }}
            NEXT_PUBLIC_MIDTRANS_PRODUCTION=false
      - name: Package source-free installer
        run: deploy/vps/package.sh /tmp/whenya-installer.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: whenya-installer-${{ inputs.release }}
          path: /tmp/whenya-installer.tar.gz
