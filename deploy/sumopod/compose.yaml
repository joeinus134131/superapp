name: whenya
services:
  api:
    image: whenya-api:${WHENYA_RELEASE:-candidate}
    build:
      context: ../../backend
      dockerfile: ../deploy/sumopod/Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - path: ./api.env
        format: raw
    environment:
      PORT: "8080"
      TZ: Asia/Jakarta
      SKIP_AUTO_MIGRATION: "true"
    ports:
      - "127.0.0.1:${API_BIND_PORT:-18080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
